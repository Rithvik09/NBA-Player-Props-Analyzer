name: tests

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel in-flight runs on the same branch when a new push lands — saves CI
# minutes and keeps the dashboard meaningful.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']

    services:
      # The app is PostgreSQL-only now. 14 matches the version we develop
      # against locally and is the floor Neon supports.
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nba_props_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Prefer the locked file when present (deterministic)
          if [[ -f requirements.lock ]]; then
            pip install -r requirements.lock
          else
            pip install -r requirements.txt
          fi
          pip install pytest pytest-cov

      - name: Run tests
        # NBA_API_OFFLINE keeps any test that forgets to mock from making a
        # real network call — catches regressions early.
        # TEST_DATABASE_URL — not DATABASE_URL — points at the service
        # container above. The suite drops and recreates its schema on
        # start, so it reads a variable the application never looks at and
        # checks the name has "test" as a word and the host is local
        # (conftest enforces both). conftest copies it into DATABASE_URL
        # for the code under test.
        env:
          NBA_API_OFFLINE: "1"
          PYTHONUNBUFFERED: "1"
          TEST_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/nba_props_test"
        run: |
          pytest --cov=src --cov-report=term-missing -q

      - name: Smoke-import production entrypoint
        # Cheapest possible "does it boot" gate.
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/nba_props_test"
        run: |
          python -c "from src.app import app; print(app.url_map)"
