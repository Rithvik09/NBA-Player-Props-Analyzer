name: tests

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel in-flight runs on the same branch when a new push lands — saves CI
# minutes and keeps the dashboard meaningful.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Prefer the locked file when present (deterministic)
          if [[ -f requirements.lock ]]; then
            pip install -r requirements.lock
          else
            pip install -r requirements.txt
          fi
          pip install pytest pytest-cov

      - name: Run tests
        # NBA_API_OFFLINE keeps any test that forgets to mock from making a
        # real network call — catches regressions early.
        env:
          NBA_API_OFFLINE: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          pytest --cov=src --cov-report=term-missing -q

      - name: Smoke-import production entrypoint
        # Cheapest possible "does it boot" gate.
        run: |
          python -c "from src.app import app; print(app.url_map)"
