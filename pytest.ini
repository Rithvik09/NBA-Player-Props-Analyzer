[pytest]
# Only collect from tests/. scripts/test_models.py is a standalone CLI
# runner whose name collides with pytest's auto-discovery — pinning
# testpaths keeps it out of the default collection.
testpaths = tests
addopts = -ra

# Two sklearn warnings are benign-by-design in our pipeline (see the
# block at the top of src/models.py for the full reasoning). pytest's
# warning capture is independent of warnings.filterwarnings() at
# runtime, so we re-state the filters here too — without this, pytest
# promotes them back to visible and clutters every run.
filterwarnings =
    ignore:.*FrozenEstimator does not appear to accept sample_weight.*:UserWarning
    ignore:X has feature names, but \w+ was fitted without feature names:UserWarning
